name: Axisymmetric grain prototypes
on:
  push:
    branches: [rigid-axisymmetric-kokkos]
    paths:
      - 'src/axisymmetric_*.h'
      - 'src/grain_beam_reference.h'
      - 'src/grain_maxwellian_reference.h'
      - 'src/grain_poisson_reference.h'
      - 'src/grain_axial_elastic_event.h'
      - 'src/grain_exposure_reference.h'
      - 'src/grain_axisymmetric_cell_reference.h'
      - 'src/grain_annular_encounter_diagnostic.h'
      - 'src/grain_weighted_split_reference.h'
      - 'src/grain_dsmc_mass_reference.h'
      - 'src/grain_momentum_budget.h'
      - 'src/KOKKOS/kokkos_*grain*.h'
      - 'tests/axisymmetric_rigid/**'
      - '.github/workflows/axisymmetric-grain-tests.yml'
  workflow_dispatch:

jobs:
  geometry-and-impulse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Standalone C++11 regression tests
        run: bash tests/axisymmetric_rigid/run_standalone_tests.sh

  kokkos-serial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: 4.5.01
          path: _kokkos
      - name: Build Kokkos (Serial backend)
        run: |
          cmake -S _kokkos -B /tmp/kokkos-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/kokkos-install \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_TESTS=OFF
          cmake --build /tmp/kokkos-build --parallel 2
          cmake --install /tmp/kokkos-build
      - name: Compile and run grain kernels
        run: |
          cmake -S tests/axisymmetric_rigid -B /tmp/axis-grain-build \
            -DCMAKE_PREFIX_PATH=/tmp/kokkos-install
          cmake --build /tmp/axis-grain-build --parallel 2
          ctest --test-dir /tmp/axis-grain-build --output-on-failure

# CPU Kokkos compilation is only a portability smoke test.
# No NVIDIA CUDA, AMD HIP, Intel SYCL, full SPARTA coupling,
# or numerical gas-grain physics is validated in this workflow.

  sparta-kokkos-diagnostic-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Configure full SPARTA with read-only diagnostic
        run: |
          cmake -S cmake -B /tmp/sparta-grain-audit-build \
            -C cmake/presets/kokkos_mpi_only.cmake \
            -DCMAKE_CXX_FLAGS=-DSPARTA_GRAIN_READONLY_DIAGNOSTIC \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=OFF \
            -DSPARTA_ENABLE_TESTING=OFF
      - name: Compile actual SPARTA Kokkos source
        run: cmake --build /tmp/sparta-grain-audit-build --parallel 2
      - name: Confirm SPARTA executable exists
        run: |
          find /tmp/sparta-grain-audit-build -type f \
            \( -name 'spa_*' -o -name 'sparta' \) -executable -print | tee /tmp/sparta-grain-executables.txt
          test -s /tmp/sparta-grain-executables.txt
